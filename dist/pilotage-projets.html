<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilotage de projets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8h-7' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f0f2f7;
  --border: #e2e5ee;
  --text: #1c2233;
  --muted: #667085;
  --primary: #3b5bdb;
  --primary-hover: #2f4ac0;
  --primary-soft: #e7ecfd;
  --success: #2b8a3e;
  --success-soft: #e3f5e7;
  --warning: #b35c00;
  --warning-soft: #fff1dc;
  --danger: #c92a2a;
  --danger-soft: #fde8e8;
  --info: #1971c2;
  --info-soft: #e1efff;
  --milestone: #7048e8;
  --milestone-soft: #efe9ff;
  --sidebar: #161b2e;
  --sidebar-text: #c5cbe0;
  --radius: 10px;
  --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 8%);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1320;
    --surface: #181d2d;
    --surface-2: #20263a;
    --border: #2c3349;
    --text: #e6e9f2;
    --muted: #97a0b8;
    --primary: #6f8cff;
    --primary-hover: #8aa1ff;
    --primary-soft: #253058;
    --success: #5cc97a;
    --success-soft: #1d3527;
    --warning: #f0a44b;
    --warning-soft: #3a2c19;
    --danger: #ff7b7b;
    --danger-soft: #3d2023;
    --info: #6cb4ff;
    --info-soft: #1c2d45;
    --milestone: #a78bfa;
    --milestone-soft: #2e2550;
    --sidebar: #0a0d17;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: .95rem; }

/* --- Mise en page ------------------------------------------------------ */

.layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }

.sidebar {
  background: var(--sidebar);
  color: var(--sidebar-text);
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; line-height: 1.1; margin: 0 6px 28px; }
.brand:hover { text-decoration: none; }
.brand small { font-weight: 400; color: var(--sidebar-text); }
.brand-mark {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9px;
  background: #3b5bdb; color: #fff; font-size: 1.1rem;
}
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav a { color: var(--sidebar-text); padding: 9px 12px; border-radius: 8px; }
.sidebar nav a:hover { background: rgb(255 255 255 / 6%); text-decoration: none; color: #fff; }
.sidebar nav a.is-active { background: rgb(255 255 255 / 10%); color: #fff; font-weight: 600; }

main { padding: 28px 32px 48px; min-width: 0; outline: none; }

.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.page-header p { margin: 4px 0 0; }
.page-header .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.description { max-width: 70ch; }
.back { display: inline-block; margin-bottom: 8px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.grid-2 > .card { margin-bottom: 0; }
.grid-wide-left { grid-template-columns: 2fr 1fr; }
.grid-wide-right { grid-template-columns: 1fr 2fr; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 20px;
  min-width: 0;
}
.card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 16px; }
.spacer { flex: 1; }
.grow { flex: 1; min-width: 0; }

/* --- Composants -------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-danger-ghost { background: transparent; border-color: transparent; color: var(--danger); }
.btn-danger-ghost:hover { background: var(--danger-soft); }
.btn-small { padding: 5px 10px; font-size: .85rem; }
.icon-btn { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); }

.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600;
  background: var(--surface-2); color: var(--muted); white-space: nowrap; vertical-align: middle;
}
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-milestone { background: var(--milestone-soft); color: var(--milestone); }

.muted { color: var(--muted); }
.small { font-size: .82rem; }
.text-danger { color: var(--danger); font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count {
  display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 999px; text-align: center;
  background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 600;
}

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; border-top: 3px solid var(--primary);
}
.stat-success { border-top-color: var(--success); }
.stat-warning { border-top-color: var(--warning); }
.stat-danger { border-top-color: var(--danger); }
.stat-label { color: var(--muted); font-size: .82rem; font-weight: 500; }
.stat-value { font-size: 1.6rem; font-weight: 700; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.stat-hint { color: var(--muted); font-size: .8rem; display: grid; gap: 6px; }

.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: inherit; background: var(--primary); transition: width .3s; }
.progress-info .progress-fill { background: var(--primary); }
.progress-success .progress-fill { background: var(--success); }
.progress-warning .progress-fill { background: var(--warning); }
.progress-danger .progress-fill { background: var(--danger); }

.avatar {
  display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary); font-size: .72rem; font-weight: 700;
}
.avatar-empty { background: var(--surface-2); color: var(--muted); }
.person { display: flex; align-items: center; gap: 10px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty h1 { color: var(--text); margin-bottom: 8px; }
.loading { color: var(--muted); }
.hint { margin-top: 12px; }

/* --- Tableaux ---------------------------------------------------------- */

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em;
  color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border);
}
.table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
.table-hover tbody tr { cursor: pointer; }
.table-hover tbody tr:hover { background: var(--surface-2); }
.w-bar { min-width: 140px; }
.w-bar .progress { margin-bottom: 4px; }

/* --- Projets ----------------------------------------------------------- */

.segmented { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.segmented button {
  border: 0; background: none; padding: 6px 12px; border-radius: 7px; font: inherit; color: var(--muted); cursor: pointer;
}
.segmented button.is-active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.project-card { display: flex; flex-direction: column; gap: 8px; color: inherit; margin: 0; transition: border-color .15s; }
.project-card:hover { text-decoration: none; border-color: var(--primary); }
.project-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.project-card p { margin: 0; color: var(--muted); }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.metric { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin-top: 4px; }
.project-card-foot {
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto; color: var(--muted);
}

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text); text-decoration: none; }
.tabs a.is-active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* --- Kanban ------------------------------------------------------------ */

.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.kanban-col {
  background: var(--surface-2); border-radius: var(--radius); padding: 12px;
  border: 2px dashed transparent; transition: border-color .15s, background .15s;
}
.kanban-col.is-over { border-color: var(--primary); background: var(--primary-soft); }
.kanban-col > header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.kanban-items { display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
.kanban-empty { text-align: center; padding: 16px 0; margin: 0; }
.task-card {
  background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--primary);
  border-radius: 8px; padding: 10px 12px; cursor: grab; box-shadow: var(--shadow);
}
.task-card:hover { border-color: var(--primary); }
.task-card.is-overdue { border-left-color: var(--danger); }
.task-card.is-dragging { opacity: .5; }
[data-status="done"] .task-card { border-left-color: var(--success); }
[data-status="done"] .task-title { text-decoration: line-through; color: var(--muted); }
.task-title { font-weight: 600; margin-bottom: 8px; }
.task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inline { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }

select, input, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

/* --- Échéances --------------------------------------------------------- */

.deadlines, .milestones { list-style: none; margin: 0; padding: 0; }
.deadline, .milestones li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border); }
.deadline:last-child, .milestones li:last-child { border-bottom: 0; }
.deadline-date { display: flex; flex-direction: column; width: 96px; flex: none; font-size: .82rem; }
.deadline-main { flex: 1; min-width: 0; }
.deadline.is-overdue { background: linear-gradient(90deg, var(--danger-soft), transparent 60%); }
.milestones li.is-done strong { text-decoration: line-through; color: var(--muted); }
.check { width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; flex: none; }

/* --- Planning (Gantt) -------------------------------------------------- */

.gantt { position: relative; font-size: .82rem; }
.gantt-row { display: grid; grid-template-columns: 190px 1fr; align-items: center; min-height: 34px; border-bottom: 1px solid var(--border); }
.gantt-row:last-of-type { border-bottom: 0; }
.gantt-label { display: flex; flex-direction: column; padding-right: 10px; overflow: hidden; }
.gantt-label a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt-track { position: relative; height: 100%; min-height: 34px; }
.gantt-scale { min-height: 24px; }
.gantt-month { position: absolute; top: 4px; color: var(--muted); border-left: 1px solid var(--border); padding-left: 4px; white-space: nowrap; }
.gantt-bar { position: absolute; top: 9px; height: 16px; border-radius: 5px; background: var(--muted); }
.gantt-bar.status-todo, .swatch.status-todo { background: #98a2b3; }
.gantt-bar.status-in_progress, .swatch.status-in_progress { background: var(--primary); }
.gantt-bar.status-done, .swatch.status-done { background: var(--success); }
.gantt-bar.is-overdue, .swatch.is-overdue { background: var(--danger); }
.gantt-diamond {
  position: absolute; top: 11px; width: 12px; height: 12px; margin-left: -6px;
  background: var(--milestone); transform: rotate(45deg);
}
.gantt-diamond.is-done { background: var(--success); }
.gantt-diamond.is-overdue { background: var(--danger); }
.gantt-overlay { position: absolute; inset: 0; display: grid; grid-template-columns: 190px 1fr; pointer-events: none; }
.gantt-overlay .gantt-track { pointer-events: none; }
.gantt-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--warning); }
.gantt-end { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--muted); opacity: .6; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 12px; }
.swatch { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: -6px; }
.swatch.today { width: 3px; background: var(--warning); }

/* --- Budget ------------------------------------------------------------ */

.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin: 0 0 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.subhead { margin: 20px 0 10px; }
.bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 10px; font-size: .85rem; }
.hbar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.hbar div { height: 100%; background: var(--milestone); border-radius: inherit; }

/* --- Fenêtre modale ---------------------------------------------------- */

dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(600px, calc(100vw - 32px));
  background: var(--surface); color: var(--text); box-shadow: 0 20px 50px rgb(0 0 0 / 25%);
}
dialog::backdrop { background: rgb(15 19 32 / 55%); }
.modal-form > header, .modal-form > footer { display: flex; align-items: center; gap: 8px; padding: 16px 20px; }
.modal-form > header { justify-content: space-between; border-bottom: 1px solid var(--border); }
.modal-form > footer { border-top: 1px solid var(--border); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding: 18px 20px; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 500; }
.field.full { grid-column: 1 / -1; }
.field-check { flex-direction: row; align-items: center; align-self: end; gap: 8px; padding-bottom: 8px; }
.field-check .field-error { flex-basis: 100%; }
.field-error { color: var(--danger); font-weight: 500; min-height: 0; }
.field-error:empty { display: none; }
.form-error { margin: 0 20px 12px; padding: 10px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); }

#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
.toast {
  padding: 10px 16px; border-radius: 8px; color: #fff; background: #344054; box-shadow: var(--shadow);
  animation: toast-in .2s ease-out;
}
.toast-success { background: var(--success); }
.toast-danger { background: var(--danger); }
@keyframes toast-in { from { transform: translateY(10px); opacity: 0; } }

/* --- Données (import / export / éditeur) ------------------------------- */

.stats-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stat-compact { padding: 12px 14px; }
.stat-compact .stat-value { font-size: 1.3rem; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stack > .card { margin-bottom: 0; }
.steps { margin: 0 0 14px; padding-left: 18px; display: grid; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
.actions.center { justify-content: center; }

.dropzone {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 16px;
  border: 2px dashed var(--border); border-radius: var(--radius); cursor: pointer; text-align: center;
  background: var(--surface-2); transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.is-over { border-color: var(--primary); background: var(--primary-soft); }
.dropzone strong { color: var(--primary); word-break: break-all; }

.modes { border: 0; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.modes label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.modes label:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
.modes input { margin-top: 3px; accent-color: var(--primary); }

.report { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
.report h3 { margin-bottom: 10px; }
.warnings { margin: 10px 0 0; padding-left: 18px; color: var(--warning); }
.errors { max-height: 320px; overflow-y: auto; margin-top: 8px; }

.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { background: var(--danger); filter: brightness(1.1); }
.danger-zone { border-color: var(--danger-soft); }
.icon-btn.danger { font-size: 1rem; opacity: .6; }
.icon-btn.danger:hover { opacity: 1; }

.grid-wrap { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
.data-grid { font-size: .85rem; }
.data-grid thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; white-space: nowrap; }
.data-grid td { padding: 3px 4px; }
.data-grid td > input:not([type=checkbox]), .data-grid td > select {
  width: 100%; min-width: 90px; border-color: transparent; background: transparent; padding: 5px 6px; border-radius: 6px;
}
.data-grid td > input:hover, .data-grid td > select:hover { border-color: var(--border); }
.data-grid td > input:focus, .data-grid td > select:focus { background: var(--surface); }
.data-grid .col-text input { min-width: 160px; }
.data-grid .col-wide input { min-width: 240px; }
.data-grid .col-ref select { min-width: 170px; }
.data-grid .col-date input { min-width: 135px; }
.data-grid .col-number input { min-width: 90px; text-align: right; }
.data-grid tbody tr:hover { background: var(--surface-2); }
.data-grid td.is-saved { animation: saved 1.2s ease-out; }
.data-grid td.is-invalid > * { border-color: var(--danger) !important; }
@keyframes saved { from { background: var(--success-soft); } to { background: transparent; } }
input[type=search] { min-width: 220px; }

/* --- Sauvegarde (barre latérale) ---------------------------------------- */

.sidebar { display: flex; flex-direction: column; overflow-y: auto; }
.save-panel { margin-top: auto; padding: 14px 6px 0; border-top: 1px solid rgb(255 255 255 / 10%); display: grid; gap: 10px; }
.save-status { display: grid; gap: 3px; font-size: .78rem; line-height: 1.35; color: var(--sidebar-text); word-break: break-word; }
.save-status .warn { color: #ffc078; }
.save-status .ok { color: #8ce99a; }
.save-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.version { color: rgb(255 255 255 / 35%); font-size: .7rem; }
.btn-sidebar { background: transparent; color: #fff; border-color: rgb(255 255 255 / 25%); }
.btn-sidebar:hover { background: rgb(255 255 255 / 8%); }

/* --- Budget --------------------------------------------------------------- */

.stats-auto { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.gauge { position: relative; display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.gauge > span { display: block; height: 100%; }
.gauge-invoiced { background: var(--success); }
.gauge-committed { background: var(--primary); }
.gauge-available { background: var(--surface-2); }
.swatch.gauge-available { background: var(--border); }
.gauge-limit { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--danger); }
.gauge:has(.gauge-limit) .gauge-committed { background: linear-gradient(90deg, var(--primary), var(--danger)); }
.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

  // src/ui/views/budget.js
  var pct = (rate) => Number.isFinite(rate) ? `${Math.round(rate * 100)} %` : "—";
  function rateTone(committed, budget) {
    if (committed > budget + 5e-3) return "danger";
    if (budget > 0 && committed > 0.9 * budget) return "warning";
    return "success";
  }
  var STATUS_TONE2 = { committed: "info", partial: "warning", done: "success" };
  var expenseStatusBadge = (e) => {
    const s = expenseStatus(e);
    return badge(LABELS.expenseStatus[s], STATUS_TONE2[s]);
  };
  function budgetKpis(t, { budgetLabel = "Budget global" } = {}) {
    return `<section class="stats stats-5">
    ${stat(budgetLabel, money(t.budget), t.allocated !== void 0 ? `Réparti sur les postes : ${money(t.allocated)}` : "")}
    ${stat("Engagé", money(t.committed), `${pct(t.committed_rate)} du budget`, rateTone(t.committed, t.budget) === "success" ? "" : rateTone(t.committed, t.budget))}
    ${stat("Réalisé", money(t.invoiced), `${pct(t.invoiced_rate)} du budget · facturé / payé`)}
    ${stat("Disponible", money(t.available), "Budget − engagé", t.available < 0 ? "danger" : "success")}
    ${stat("Reste à payer", money(t.to_pay), "Engagé − réalisé")}
  </section>`;
  }
  function budgetGauge(t) {
    const base = Math.max(t.budget, t.committed, 1);

      input.defaultValue = input.value;
      if (input.tagName === "SELECT") [...input.options].forEach((o) => {
        o.defaultSelected = o.selected;
      });
      if (field.type === "boolean") input.defaultChecked = input.checked;
      void cell.offsetWidth;
      cell.classList.add("is-saved");
    } catch (err) {
      cell.classList.add("is-invalid");
      const labelOf = (key) => def.fields.find((f) => f.name === key)?.label ?? key;
      const detail = Object.entries(err.details ?? {}).map(([key, msg]) => `${labelOf(key)} : ${msg}`).join(" ; ");
      toast(detail || `${field.label} : ${err.message}`, "danger");
      if (field.type === "boolean") input.checked = input.defaultChecked;
      else if (input.tagName === "SELECT") [...input.options].forEach((o) => {
        o.selected = o.defaultSelected;
      });
      else input.value = input.defaultValue;
    }
  }
  function addRow(def, tab, refOptions, refresh) {
    const fields = def.fields.map((f) => {
      const base = { name: f.name, label: f.label, required: f.required };
      switch (f.type) {
        case "enum":
          return { ...base, type: "select", options: options(LABELS[f.labels]) };
        case "ref":
          return { ...base, type: "select", options: refOptions[f.ref], full: true };
        case "boolean":
          return { ...base, type: "checkbox" };
        case "number":
          return { ...base, type: "number", min: f.min, step: "any" };
        case "date":
          return { ...base, type: "date" };
        default:
          return { ...base, type: f.multiline ? "textarea" : f.format === "email" ? "email" : "text", full: f.multiline };
      }
    });
    const defaults = Object.fromEntries(def.fields.filter((f) => f.default !== void 0).map((f) => [f.name, f.default]));
    openForm({
      title: `Nouvelle ligne — ${def.label}`,
      fields,
      values: defaults,
      submitLabel: "Ajouter",
      onSubmit: async (data) => {
        await api.create(tab, data);
        toast("Ligne ajoutée", "success");
        refresh();
      }
    });
  }

  // src/ui/views/portfolio.js
  async function portfolio({ el: el2, refresh }) {
    const includeCompleted = sessionStorage.getItem("portfolio-completed") !== "0";
    const data = await api.get("portfolio", { completed: includeCompleted ? "1" : "0" });
    const budgets = await Promise.all(data.projects.map((p) => api.get(`projects/${p.id}/budget`)));
    const t = data.totals;
    const alerts = [];
    for (const b of budgets) {
      const name = b.project.name;
      if (b.totals.committed > b.totals.budget + 5e-3) {
        alerts.push(["danger", b.project.id, `${name} : budget global dépassé de ${money(b.totals.committed - b.totals.budget)}`]);
      }
      for (const l of b.lines.filter((x) => x.over)) {
        alerts.push(["danger", b.project.id, `${name} › ${l.name} : poste dépassé de ${money(l.committed - l.budget)}`]);
      }
      for (const l of b.lines.filter((x) => !x.over && x.budget > 0 && x.committed > 0.9 * x.budget)) {
        alerts.push(["warning", b.project.id, `${name} › ${l.name} : engagé à ${pct(l.committed_rate)}`]);
      }
      if (b.totals.over_allocated) {
        alerts.push(["warning", b.project.id, `${name} : postes supérieurs au budget global de ${money(-b.totals.unallocated)}`]);
      }
    }
    el2.innerHTML = `
    <header class="page-header">
      <div><h1>Project management</h1>
        <p class="muted">Pilotage budgétaire consolidé : budget global, postes de dépense, engagé et réalisé.</p></div>
      <label class="inline small"><input type="checkbox" data-action="toggle-completed"${includeCompleted ? " checked" : ""}> Inclure les projets terminés</label>
    </header>

    ${data.projects.length ? `
    ${budgetKpis(t, { budgetLabel: "Budget global" })}

    <div class="grid-2 grid-wide-left">
      <section class="card">
        <header class="card-header"><h2>Consommation du budget (tous projets)</h2></header>
        ${budgetGauge(t)}
        <p class="muted small">Engagé = commandes et contrats signés · Réalisé = part facturée ou payée ·
          Disponible = budget − engagé · Reste à payer = engagé − réalisé.</p>
      </section>
      <section class="card">
        <header class="card-header"><h2>Alertes <span class="count">${alerts.length}</span></h2></header>
        ${alerts.length ? `<ul class="alerts">${alerts.map(([tone, id2, msg]) => `<li class="alert alert-${tone}"><a href="#/projets/${id2}/budget">${esc(msg)}</a></li>`).join("")}</ul>` : '<p class="alert alert-success">Aucun dépassement : tous les projets et postes sont dans leur enveloppe.</p>'}
      </section>
    </div>

    <section class="card">
      <header class="card-header"><h2>Budget par projet</h2></header>
      <div class="table-wrap"><table class="table table-hover">
        <thead><tr><th>Projet</th>${FIGURES_HEAD}<th class="num">Reste à payer</th></tr></thead>
        <tbody>${data.projects.map((p) => `<tr data-href="#/projets/${p.id}/budget">
          <td><a href="#/projets/${p.id}/budget"><strong>${esc(p.name)}</strong></a>
            <div>${projectStatusBadge(p.status)} <span class="muted small">${p.line_count} poste(s)</span></div></td>
          ${figuresCells(p)}
          <td class="num">${money(p.to_pay)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Total</td><td class="num">${money(t.budget)}</td><td class="num">${money(t.committed)}</td>
          <td class="num">${money(t.invoiced)}</td><td class="num${t.available < 0 ? " text-danger" : ""}">${money(t.available)}</td>
          <td>${pct(t.committed_rate)} engagé</td><td class="num">${money(t.to_pay)}</td></tr></tfoot>
      </table></div>
    </section>

    <section class="card">
        <header class="card-header"><h2>Par nature de dépense</h2></header>
        ${data.byCategory.length ? `<div class="table-wrap"><table class="table">
          <thead><tr><th>Nature</th>${FIGURES_HEAD}</tr></thead>
          <tbody>${data.byCategory.map((c) => `<tr>
            <td>${c.category ? esc(LABELS.category[c.category]) : '<em class="muted">Non affecté à un poste</em>'}</td>
            ${figuresCells(c)}</tr>`).join("")}</tbody>
        </table></div>` : '<p class="muted small">Aucun poste budgétaire défini.</p>'}
    </section>
    <section class="card">
        <header class="card-header"><h2>Évolution mensuelle (tous projets)</h2></header>
        ${monthlyTable(data.monthly, t.budget)}
    </section>` : empty("Aucun projet à afficher.", '<a class="btn btn-primary" href="#/projets">Aller aux projets</a>')}`;
    el2.onclick = (e) => {
      if (e.target.closest("a")) return;
      const row = e.target.closest("[data-href]");
      if (row) location.hash = row.dataset.href;
    };
    el2.onchange = (e) => {
      if (e.target.dataset.action !== "toggle-completed") return;
      sessionStorage.setItem("portfolio-completed", e.target.checked ? "1" : "0");
      refresh();
    };
  }

  // src/ui/app.js
  var ROUTES = [
    [/^#?\/?$/, "dashboard", dashboard2],
    [/^#\/projets\/?$/, "projets", projectsList],
    [/^#\/pilotage\/?$/, "pilotage", portfolio],
    [/^#\/projets\/(\d+)(?:\/([\w-]+))?\/?$/, "projets", projectDetail],
    [/^#\/echeances\/?$/, "echeances", deadlines2],
    [/^#\/contributeurs\/?$/, "contributeurs", contributors],
    [/^#\/donnees\/?$/, "donnees", dataView]
  ];
  var HANDLERS = ["onclick", "onchange", "oninput", "ondragstart", "ondragend", "ondragover", "ondragleave", "ondrop"];
  var el = document.getElementById("app");
  var renderId = 0;
  async function render() {
    const current = ++renderId;
    const hash = location.hash || "#/";
    const match = ROUTES.map(([re, nav, view2]) => [hash.match(re), nav, view2]).find(([m2]) => m2);
    document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("is-active", a.dataset.nav === match?.[1]));
    for (const h of HANDLERS) el[h] = null;
    if (!match) {
      el.innerHTML = '<div class="empty"><h1>Page introuvable</h1><a class="btn" href="#/">Retour au tableau de bord</a></div>';
      return;
    }
    const [m, , view] = match;
    if (!el.children.length) el.innerHTML = '<p class="loading">Chargement…</p>';
    try {
      const target = document.createElement("div");
      await view({ el: target, params: m.slice(1), refresh: render });
      if (current !== renderId) return;
      for (const h of HANDLERS) el[h] = target[h];
      el.replaceChildren(...target.childNodes);
    } catch (err) {
      if (current !== renderId) return;
      console.error(err);
      el.innerHTML = `<div class="empty"><h1>Impossible d'afficher la page</h1><p>${esc(err.message)}</p>
      <a class="btn" href="#/">Retour au tableau de bord</a></div>`;
    }
  }
  var ago = (iso) => {
    const min = Math.round((Date.now() - Date.parse(iso)) / 6e4);
    if (min < 1) return "à l'instant";
    if (min < 60) return `il y a ${min} min`;
    const d = new Date(iso);
    return d.toDateString() === (/* @__PURE__ */ new Date()).toDateString() ? `à ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : `le ${d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}`;
  };
  function renderSaveStatus() {
    const box = document.querySelector("[data-save-status]");
    const lines = [];
    if (!saveState.browserStorage) {
      lines.push('<span class="warn">⚠ Ce navigateur ne conserve pas les données : enregistrez un fichier avant de fermer.</span>');
    }
    if (saveState.lastFileSave) {
      lines.push(`<span>Fichier : <strong>${esc(saveState.fileName ?? "")}</strong></span>`);
      lines.push(saveState.unsavedChanges ? '<span class="warn">● Modifications non enregistrées dans le fichier</span>' : `<span class="ok">✓ Enregistré ${esc(ago(saveState.lastFileSave))}</span>`);
    } else if (store.counts().projects > 0) {
      lines.push('<span class="warn">● Jamais enregistré dans un fichier</span>');
    } else {
      lines.push("<span>Aucune donnée pour l'instant</span>");
    }
    box.innerHTML = lines.join("");
  }
  async function save() {
    try {
      const name = await saveToFile();
      if (name) toast(`Données enregistrées dans « ${name} »`, "success");
    } catch (err) {
      toast(`Enregistrement impossible : ${err.message}`, "danger");
    }
  }
  async function open() {
    if (saveState.unsavedChanges && store.counts().projects > 0 && !confirmAction("Les données actuelles contiennent des modifications non enregistrées dans un fichier.\nOuvrir un autre fichier les remplacera. Continuer ?")) return;
    const file = await pickFile();
    if (!file) return;
    try {
      const report = openDataFile(file);
      if (report.saved) {
        toast(`Fichier « ${file.name} » ouvert`, "success");
        location.hash = "#/";
        render();
      } else {
        toast(`Le fichier contient ${report.errors.length} erreur(s) : utilisez la rubrique Données pour les voir.`, "danger");
      }
    } catch (err) {
      toast(err.message, "danger");
    }
  }
  document.querySelector("[data-save]").addEventListener("click", save);
  document.querySelector("[data-open]").addEventListener("click", open);
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      save();
    }
  });
  onSaveStateChange(renderSaveStatus);
  setInterval(renderSaveStatus, 6e4);
  window.addEventListener("data-reloaded", () => {
    toast("Données mises à jour depuis un autre onglet");
    render();
  });
  initPersistence();
  var lastHash = location.hash;
  window.addEventListener("hashchange", () => {
    const samePage = lastHash.split("/").slice(0, 3).join("/") === location.hash.split("/").slice(0, 3).join("/");
    lastHash = location.hash;
    render().then(() => {
      if (!samePage) window.scrollTo(0, 0);
    });
  });
  render();
})();
</script>
